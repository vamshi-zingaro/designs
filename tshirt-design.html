<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zingaro AI — T-Shirt Designs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #060606;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 50px 20px;
  }

  h1 {
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #e5e5e5;
  }

  .subtitle {
    text-align: center;
    color: #444;
    margin-bottom: 70px;
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

  .designs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
    gap: 70px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .design-card { text-align: center; }

  .design-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    color: #555;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 600;
  }

  .label {
    font-size: 10px;
    color: #333;
    margin-top: 18px;
    letter-spacing: 3px;
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ============ T-SHIRT ============ */
  .tshirt-wrapper {
    position: relative;
    width: 460px;
    height: 560px;
    margin: 0 auto;
  }

  .tshirt { position: relative; width: 100%; height: 100%; }
  .tshirt svg.tshirt-svg { width: 100%; height: 100%; }

  .tshirt-design {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* Logo shared */
  .logo-img {
    display: block;
    object-fit: contain;
  }

  /* ============ DESIGN 1: Minimal Brand — Big & Bold ============ */
  .design1 .tshirt-design { width: 300px; top: 140px; }

  .d1-logo { width: 72px; height: 72px; margin-bottom: 24px; border-radius: 16px; }

  .d1-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .d1-brand .ai {
    color: #f97316;
  }

  .d1-tagline {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ffffff;
    margin-top: 18px;
  }

  /* ============ DESIGN 2: Feature List — Bold ============ */
  .design2 .tshirt-design { width: 290px; top: 115px; }

  .d2-logo { width: 52px; height: 52px; margin-bottom: 14px; border-radius: 12px; }

  .d2-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 4px;
    line-height: 1;
  }

  .d2-ai {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #f97316;
    line-height: 1;
    margin-bottom: 20px;
  }

  .d2-divider {
    width: 50px;
    height: 2px;
    background: #f97316;
    margin-bottom: 20px;
    border-radius: 1px;
  }

  .d2-features {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    padding-left: 6px;
  }

  .d2-feature {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .d2-feature-dot {
    width: 5px;
    height: 5px;
    background: #f97316;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .d2-feature-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #ccc;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .d2-footer {
    margin-top: 22px;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    color: #333;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* ============ DESIGN 3: Capabilities Grid ============ */
  .design3 .tshirt-design { width: 300px; top: 118px; }

  .d3-logo { width: 52px; height: 52px; margin-bottom: 14px; border-radius: 12px; }

  .d3-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 4px;
    line-height: 1.1;
    white-space: nowrap;
  }

  .d3-brand .ai {
    color: #f97316;
  }

  .d3-sub {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #f97316;
    text-transform: uppercase;
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .d3-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
  }

  .d3-cell {
    padding: 12px 8px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 10px;
    text-align: center;
    background: transparent;
  }

  .d3-cell-icon {
    margin-bottom: 6px;
    display: block;
  }

  .d3-cell-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .d3-footer {
    margin-top: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    color: #ffffff;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* ============ DESIGN 4: Checklist Back Print ============ */
  .design4 .tshirt-design { width: 280px; top: 120px; }

  .d4-header {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .d4-logo { width: 48px; height: 48px; margin-bottom: 12px; border-radius: 11px; }

  .d4-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 22px;
    line-height: 1;
  }

  .d4-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid #1a1a1a;
  }

  .d4-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid #141414;
  }

  .d4-item-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #aaa;
    letter-spacing: 1px;
  }

  .d4-item-check {
    color: #f97316;
    font-size: 14px;
    font-weight: 800;
  }

  .d4-url {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: #444;
    letter-spacing: 3px;
  }

  /* ============ DESIGN 5: Ultra Minimal — Logo Only ============ */
  .design5 .tshirt-design { width: 220px; top: 160px; }

  .d5-logo { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 20px; }

  .d5-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #666;
    text-transform: uppercase;
  }

  /* ============ DESIGN 6: Workflow Pipeline ============ */
  .design6 .tshirt-design { width: 280px; top: 115px; }

  .d6-logo { width: 44px; height: 44px; border-radius: 10px; margin-bottom: 10px; }

  .d6-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 20px;
    line-height: 1;
  }

  .d6-flow {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .d6-node {
    width: 100%;
    padding: 11px 16px;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.015);
  }

  .d6-node-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #f97316;
    width: 22px;
    flex-shrink: 0;
  }

  .d6-node-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #aaa;
    letter-spacing: 0.5px;
  }

  .d6-connector {
    width: 1px;
    height: 6px;
    background: #2a2a2a;
  }

  .d6-footer {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #333;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  /* ============ DOWNLOAD BUTTONS ============ */
  .download-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
  }

  .dl-btn {
    padding: 8px 20px;
    border: 1px solid rgba(249,115,22,0.4);
    border-radius: 8px;
    background: rgba(249,115,22,0.08);
    color: #f97316;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .dl-btn:hover {
    background: rgba(249,115,22,0.18);
    border-color: #f97316;
  }
</style>

<script>
async function downloadJPG(elementId, filename) {
  const el = document.getElementById(elementId);
  const canvas = await html2canvas(el, {
    backgroundColor: '#0e0e0e',
    scale: 3,
    useCORS: true
  });
  const link = document.createElement('a');
  link.download = filename + '.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.click();
}

async function downloadPDF(elementId, filename) {
  const el = document.getElementById(elementId);
  const canvas = await html2canvas(el, {
    backgroundColor: '#0e0e0e',
    scale: 3,
    useCORS: true
  });
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
    unit: 'px',
    format: [canvas.width, canvas.height]
  });
  pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
  pdf.save(filename + '.pdf');
}

async function downloadPNG(elementId, filename) {
  const el = document.getElementById(elementId);
  const saved = el.style.cssText;
  el.style.cssText = 'position:relative; transform:none; top:auto; left:auto; pointer-events:auto; width:auto; overflow:visible; white-space:nowrap; padding:40px;';
  const canvas = await html2canvas(el, {
    backgroundColor: null,
    scale: 4,
    useCORS: true
  });
  el.style.cssText = saved;
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
